# Inert inside your vcluster (it has no Gateway): the platform routes
# https://lunzerr.cnh.radarhq.io to Service app, port 80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
spec:
  parentRefs:
    - name: cnh
      namespace: gateway
      sectionName: https
  hostnames:
    - lunzerr.cnh.radarhq.io
  rules:
    - backendRefs:
        - name: app
          port: 80
